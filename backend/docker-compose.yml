version: '3.8'

services:
  finsightai:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: finsightai:latest
    container_name: finsightai_app
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLECORS=false
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    volumes:
      - ../data:/app/data:rw
      - ../logs:/app/logs:rw
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:8000/health" ]
      interval: 15s
      timeout: 3s
      retries: 3

# Optional: add other services like redis, celery, db here
